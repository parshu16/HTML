<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FormTags</title>
</head>
<body>
   <fieldset>
    <legend>StudentDetails</legend>
    <form action="https://www.flipkart.com" method="post">
        <label for="Name">Name</label>
        <input type="text" name="" id="" maxlength="5"  required autofocus><br><br>
        <label for="password">Password:</label>
        <input type="password" name="" id="" maxlength="4"><br><br>
        <label for="email">Email:</label>
        <input type="email"><br><br>
        <label for="PhoneNumber">PhoneNumber:</label>
        <input type="tel" name="" id=""  max="13" placeholder="1234567890"><br><br>
        <label for="salary">Salary:</label>
        <input type="number" name="" id=""  min="4" value="1000" step="200" placeholder="Enter salary"><br><br>

        <label for="city">Select City:</label>
        <select name="city" id="city">
            <option value="" hidden>--Choose City--</option>
            <option value="hyderabad">Hyderabad</option>
            <option value="banglore">Banglore</option>
            <option value="chennai">Chennai</option>
        </select>
        <br><br>

        <label for="gender">Gender:</label>
        <input type="radio" name="gender" id="male">
        <label for="male">Male</label>
        <input type="radio" name="gender" id="female">
        <label for="female">female</label><br><br>
        

        <label for="skills">Skills:</label>
        <input type="checkbox" name="skills" id="html">
        <label for="html">HTML</label>
        <input type="checkbox" name="skills" id="css" >
        <label for="css">CSS</label>
        <input type="checkbox" name="skills" id="javaScript">
        <label for="javaScript">JavaScript</label><br><br>

        <label for="dob">Dob:</label>
        <input type="month" name="dob" id="">
        <input type="week" name="dob" id="">
        <input type="date" name="" id="">
        <input type="datetime-local" name="" id="">
        <input type="datetime" name="" id="">
        <input type="time" name="" id=""><br><br>

        <label for="photo">Upload Photo:</label>
        <input type="file" name="photo" id="" accept=".jpg"><br><br>

        <label for="color">Color</label>
        <input type="color" name="color" id=""><br><br>

        <label for="range">Range:</label>
        <input type="range" name="" id="range" min="0" value="0"><br><br>

        <input type="submit" value="register">
        <input type="reset" ><br><br>




        <label for="Address" >Address:</label>
        <textarea name="Address" rows="6" cols="30"></textarea>
    </form>
</fieldset>
<a href="./example.html" target="frame1">About</a>
<iframe name="frame1" width="300" height="200"></iframe>

<!--Table-->
<table border="1"  cellspacing="10" align="">
    <caption>Qspiders</caption>
    <thead>
        <tr>th</tr>
    </thead>

</table>
<details>
    <summary>ClickHere</summary>
    <p>Lorem ipsum dolor sit amet.</p>
</details>
<label for="skills">Skills</label>
<select name="" id="">
    <optgroup label="frontend">
        <option value="" hidden>--select your skills--</option>
        <option value="html">html</option>
        <option value="css">css</option>
    <!-- </optgroup> -->
    <optgroup label="backend">
        <option value="" hidden>--select your skills--</option>
        <option value="java">java</option>
        <option value="python">python</option>
    </optgroup>
</select>

<iframe src="https://www.flipkart.com" loading="lazy" title="Flipkart" frameborder="1"></iframe>
<marquee behavior="alternate" direction="right-left" >Explore tillu's skills</marquee>
</body>
